<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃 Endless Runner Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #8B4513 70%, #8B4513 100%);
            border: 5px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .score {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 20;
        }

        .game-over h1 {
            color: #FF6B6B;
            font-size: 48px;
            margin-bottom: 20px;
        }

        .game-over p {
            color: white;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .game-over button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .game-over button:hover {
            background: #45a049;
            transform: scale(1.1);
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            text-align: center;
            z-index: 10;
        }

        .instructions p {
            margin: 5px 0;
            font-size: 16px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-overlay">
            <div class="score">
                🏆 Score: <span id="score">0</span>
            </div>
            <div class="score">
                ⚡ High Score: <span id="highScore">0</span>
            </div>
        </div>

        <div class="game-over" id="gameOver">
            <h1>💀 GAME OVER!</h1>
            <p>Your Score: <span id="finalScore">0</span></p>
            <p>High Score: <span id="finalHighScore">0</span></p>
            <button onclick="restartGame()" class="pulse">🔄 Play Again</button>
        </div>

        <div class="instructions">
            <p><strong>🎮 Controls:</strong></p>
            <p>Press <strong>SPACE</strong> or <strong>UP ARROW</strong> to Jump</p>
            <p>Press <strong>DOWN ARROW</strong> to Slide</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = 800;
        canvas.height = 400;

        // Game variables
        let gameRunning = true;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let gameSpeed = 6;
        let gravity = 0.8;

        // Player object
        const player = {
            x: 50,
            y: 280,
            width: 40,
            height: 60,
            velocityY: 0,
            jumping: false,
            sliding: false,
            color: '#FF6B6B'
        };

        // Obstacles array
        let obstacles = [];
        let obstacleTimer = 0;
        let obstacleInterval = 100;

        // Clouds for background
        let clouds = [];
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 200,
                width: 80 + Math.random() * 40,
                height: 40,
                speed: 0.5 + Math.random() * 0.5
            });
        }

        // Update high score display
        document.getElementById('highScore').textContent = highScore;

        // Input handling
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            if ((e.code === 'Space' || e.code === 'ArrowUp') && !player.jumping && !player.sliding) {
                player.velocityY = -15;
                player.jumping = true;
            }

            if (e.code === 'ArrowDown' && !player.jumping) {
                player.sliding = true;
                player.height = 30;
                player.y = 310;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') {
                player.sliding = false;
                player.height = 60;
                player.y = 280;
            }
        });

        // Draw player
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 10, player.y + 15, 8, 8);
            ctx.fillRect(player.x + 25, player.y + 15, 8, 8);
            
            // Pupils
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 13, player.y + 18, 4, 4);
            ctx.fillRect(player.x + 28, player.y + 18, 4, 4);

            // Mouth
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 15, player.y + 35, 15, 3);
        }

        // Draw obstacles
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                if (obstacle.type === 'cactus') {
                    ctx.fillStyle = '#2ECC40';
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                    
                    // Cactus arms
                    ctx.fillRect(obstacle.x - 10, obstacle.y + 20, 10, 15);
                    ctx.fillRect(obstacle.x + obstacle.width, obstacle.y + 20, 10, 15);
                } else if (obstacle.type === 'bird') {
                    ctx.fillStyle = '#FF851B';
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                    
                    // Wings
                    ctx.fillRect(obstacle.x - 5, obstacle.y + 5, 10, 5);
                    ctx.fillRect(obstacle.x + obstacle.width - 5, obstacle.y + 5, 10, 5);
                }
            });
        }

        // Draw clouds
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            clouds.forEach(cloud => {
                ctx.fillRect(cloud.x, cloud.y, cloud.width, cloud.height);
                ctx.fillRect(cloud.x + 20, cloud.y - 10, cloud.width - 40, cloud.height);
            });
        }

        // Update player physics
        function updatePlayer() {
            if (player.jumping || player.y < 280) {
                player.velocityY += gravity;
                player.y += player.velocityY;

                if (player.y >= 280) {
                    player.y = 280;
                    player.velocityY = 0;
                    player.jumping = false;
                }
            }
        }

        // Update obstacles
        function updateObstacles() {
            obstacleTimer++;

            if (obstacleTimer > obstacleInterval) {
                const type = Math.random() > 0.5 ? 'cactus' : 'bird';
                const obstacle = {
                    x: canvas.width,
                    y: type === 'cactus' ? 300 : 200 + Math.random() * 80,
                    width: type === 'cactus' ? 30 : 40,
                    height: type === 'cactus' ? 40 : 20,
                    type: type
                };
                obstacles.push(obstacle);
                obstacleTimer = 0;
                obstacleInterval = 80 + Math.random() * 40;
            }

            obstacles.forEach((obstacle, index) => {
                obstacle.x -= gameSpeed;

                if (obstacle.x + obstacle.width < 0) {
                    obstacles.splice(index, 1);
                    score += 10;
                    document.getElementById('score').textContent = score;
                }
            });
        }

        // Update clouds
        function updateClouds() {
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.width < 0) {
                    cloud.x = canvas.width;
                    cloud.y = Math.random() * 200;
                }
            });
        }

        // Collision detection
        function checkCollision() {
            for (let obstacle of obstacles) {
                if (player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y) {
                    return true;
                }
            }
            return false;
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalHighScore').textContent = highScore;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Restart game
        function restartGame() {
            gameRunning = true;
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            obstacleTimer = 0;
            player.y = 280;
            player.velocityY = 0;
            player.jumping = false;
            player.sliding = false;
            
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
            
            gameLoop();
        }

        // Main game loop
        function gameLoop() {
            if (!gameRunning) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, 280);
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 280, canvas.width, 120);

            // Draw ground line
            ctx.fillStyle = '#654321';
            ctx.fillRect(0, 340, canvas.width, 5);

            // Update and draw
            drawClouds();
            updateClouds();
            updatePlayer();
            updateObstacles();
            drawPlayer();
            drawObstacles();

            // Check collision
            if (checkCollision()) {
                gameOver();
                return;
            }

            // Increase difficulty
            if (score % 100 === 0 && score > 0) {
                gameSpeed += 0.5;
            }

            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
